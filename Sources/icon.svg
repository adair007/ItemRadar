<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient: dark blue to purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>

    <!-- Radar sweep gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow filter for radar elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner shadow for depth -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded rectangle background (macOS icon shape) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgGrad)"/>

  <!-- Subtle inner highlight at top -->
  <rect x="20" y="20" width="984" height="492" rx="210" ry="210" fill="#ffffff" opacity="0.03"/>

  <!-- Radar grid: concentric circles -->
  <g transform="translate(512, 512)" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.25">
    <circle r="140"/>
    <circle r="220"/>
    <circle r="300"/>
  </g>

  <!-- Crosshairs -->
  <g transform="translate(512, 512)" stroke="#4a9eff" stroke-width="2" opacity="0.2">
    <line x1="-300" y1="0" x2="300" y2="0"/>
    <line x1="0" y1="-300" x2="0" y2="300"/>
  </g>

  <!-- Radar sweep arc (the "scanning" element) -->
  <g transform="translate(512, 512)" filter="url(#glow)">
    <!-- Main sweep wedge -->
    <path d="M 0,0 L 300,0 A 300,300 0 0,0 212,-212 Z" fill="url(#sweepGrad)" opacity="0.6"/>
    <!-- Sweep edge line -->
    <line x1="0" y1="0" x2="212" y2="-212" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Center dot / hub -->
  <circle cx="512" cy="512" r="16" fill="#e94560" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="8" fill="#ffffff"/>

  <!-- Terminal/code symbol: >_ subtly integrated at bottom -->
  <g transform="translate(512, 760)" text-anchor="middle">
    <text x="0" y="0" font-family="SF Mono, Monaco, Menlo, monospace" font-size="72" font-weight="600" fill="#ffffff" opacity="0.85" letter-spacing="2">&gt;_</text>
  </g>

  <!-- Small "ping" dots on radar rings to show "discovered" projects -->
  <g fill="#00d9ff" filter="url(#glow)">
    <!-- Ping 1 -->
    <circle cx="652" cy="412" r="8" opacity="0.9"/>
    <!-- Ping 2 -->
    <circle cx="412" cy="612" r="6" opacity="0.7"/>
    <!-- Ping 3 -->
    <circle cx="612" cy="652" r="5" opacity="0.6"/>
  </g>

  <!-- Outer subtle rim light -->
  <rect x="4" y="4" width="1016" height="1016" rx="226" ry="226" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.08"/>
</svg>