<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadowC" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="scanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS rounded rect background (light) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgC)"/>

  <!-- Scanning ring (sweeping arc) -->
  <g transform="translate(512, 512)" filter="url(#scanGlow)">
    <circle r="360" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.2"/>
    <path d="M 0,0 L 360,0 A 360,360 0 0,0 254,-254 Z" fill="#6366f1" opacity="0.08"/>
    <line x1="0" y1="0" x2="254" y2="-254" stroke="#6366f1" stroke-width="4" opacity="0.4"/>
  </g>

  <!-- Stacked project cards (3D isometric feel) -->
  <g filter="url(#shadowC)">
    <!-- Bottom card -->
    <rect x="312" y="520" width="400" height="220" rx="28" fill="url(#cardGrad3)" opacity="0.9"/>
    <rect x="352" y="560" width="120" height="16" rx="8" fill="#ffffff" opacity="0.4"/>
    <rect x="352" y="596" width="200" height="12" rx="6" fill="#ffffff" opacity="0.25"/>
    <rect x="352" y="624" width="160" height="12" rx="6" fill="#ffffff" opacity="0.25"/>

    <!-- Middle card -->
    <rect x="352" y="400" width="400" height="220" rx="28" fill="url(#cardGrad2)" opacity="0.95"/>
    <rect x="392" y="440" width="120" height="16" rx="8" fill="#ffffff" opacity="0.4"/>
    <rect x="392" y="476" width="200" height="12" rx="6" fill="#ffffff" opacity="0.25"/>
    <rect x="392" y="504" width="160" height="12" rx="6" fill="#ffffff" opacity="0.25"/>

    <!-- Top card -->
    <rect x="392" y="280" width="400" height="220" rx="28" fill="url(#cardGrad1)"/>
    <rect x="432" y="320" width="120" height="16" rx="8" fill="#ffffff" opacity="0.5"/>
    <rect x="432" y="356" width="200" height="12" rx="6" fill="#ffffff" opacity="0.3"/>
    <rect x="432" y="384" width="160" height="12" rx="6" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Small status indicators on top card -->
  <circle cx="740" cy="340" r="14" fill="#4ade80"/>
  <circle cx="740" cy="340" r="6" fill="#ffffff"/>

  <!-- Center hub / scan origin -->
  <circle cx="512" cy="512" r="24" fill="#6366f1" filter="url(#scanGlow)"/>
  <circle cx="512" cy="512" r="12" fill="#ffffff"/>

  <!-- Outer rim -->
  <rect x="4" y="4" width="1016" height="1016" rx="226" ry="226" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.06"/>
</svg>