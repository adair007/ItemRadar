<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS rounded rect background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgB)"/>

  <!-- Subtle top highlight -->
  <rect x="20" y="20" width="984" height="492" rx="210" ry="210" fill="#ffffff" opacity="0.02"/>

  <!-- Radar ripple rings (very subtle, behind terminal) -->
  <g transform="translate(512, 480)" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.15" filter="url(#softGlow)">
    <circle r="180"/>
    <circle r="260"/>
    <circle r="340"/>
  </g>

  <!-- Terminal prompt: >_ (hero element) -->
  <g transform="translate(512, 480)" text-anchor="middle" filter="url(#glowB)">
    <text x="0" y="50" font-family="SF Mono, Monaco, Menlo, Courier, monospace" font-size="280" font-weight="700" fill="#4ade80" letter-spacing="8">&gt;_</text>
  </g>

  <!-- Cursor blink bar -->
  <rect x="680" y="360" width="20" height="140" rx="3" fill="#4ade80" opacity="0.8" filter="url(#glowB)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Small radar ping dot (suggesting "discovery") -->
  <circle cx="512" cy="720" r="10" fill="#4ade80" opacity="0.6" filter="url(#glowB)"/>
  <circle cx="512" cy="720" r="4" fill="#ffffff"/>

  <!-- Status dots (like terminal status bar) -->
  <g transform="translate(512, 820)" text-anchor="middle">
    <circle cx="-60" cy="0" r="8" fill="#4ade80" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#fbbf24" opacity="0.6"/>
    <circle cx="60" cy="0" r="8" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- Outer rim -->
  <rect x="4" y="4" width="1016" height="1016" rx="226" ry="226" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.06"/>
</svg>